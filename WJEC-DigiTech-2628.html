<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WJEC Digital Technology 2026 to 2028</title>
    <style>
        :root {
            --bg-color: #064e3b;
            --card-bg: #047857;
            --card-hover: #065f46;
            --accent-color: #34d399;
            --text-main: #f0fdf4;
            --text-sub: #a7f3d0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-main);
            margin-bottom: 0.75rem;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-sub);
            letter-spacing: 0.05em;
            line-height: 1.5;
        }

        .container {
            display: flex;
            gap: 1.5rem;
            max-width: 800px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 360px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        }

        .card:hover {
            background-color: var(--card-hover);
            transform: translateY(-4px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 15px -3px rgba(52, 211, 153, 0.25);
        }

        .unit-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        .unit-subtitle {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 1.75rem;
            }
            .container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>WJEC Digital Technology 2026 to 2028</h1>
        <p class="subtitle">
            Year 10 (26/27) complete Unit 2<br>
            Year 11 (27/28) complete Unit 3
        </p>
    </header>

    <main class="container">
        <a href="2628/U2 - NEA/index.html" class="card">
            <span class="unit-title">Unit 2 - NEA brief</span>
            <span class="unit-subtitle">TBA</span>
        </a>

        <a href="2628/U3 - NEA/index.html" class="card">
            <span class="unit-title">Unit 3 - NEA brief</span>
            <span class="unit-subtitle">TBA</span>
        </a>
    </main>

</body>
</html>
